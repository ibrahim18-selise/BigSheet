# Builds BigSheet for macOS (Apple Silicon) and Windows.
# Runs on every push to main (download the builds from the run's "Artifacts"),
# and on version tags like v1.0.0, where it also publishes a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
      - run: python main.py --self-test

  build-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app
        run: |
          chmod +x build_mac.sh
          PY=python3 ./build_mac.sh
      - name: Self-test
        run: ./.venv/bin/python main.py --self-test
      - name: Package
        run: ditto -c -k --keepParent dist/BigSheet.app BigSheet-mac-apple-silicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BigSheet-mac-apple-silicon
          path: BigSheet-mac-apple-silicon.zip

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10"
          python main.py --self-test
          python -m PyInstaller --noconfirm --clean --windowed --name BigSheet --collect-data duckdb_extension_httpfs main.py
      - name: Package
        run: Compress-Archive -Path dist\BigSheet -DestinationPath BigSheet-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BigSheet-windows
          path: BigSheet-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
